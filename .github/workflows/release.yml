name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          ADSKIPPER_KEYSTORE_BASE64: ${{ secrets.ADSKIPPER_KEYSTORE_BASE64 }}
          ADSKIPPER_KEYSTORE_PASSWORD: ${{ secrets.ADSKIPPER_KEYSTORE_PASSWORD }}
          ADSKIPPER_KEY_ALIAS: ${{ secrets.ADSKIPPER_KEY_ALIAS }}
          ADSKIPPER_KEY_PASSWORD: ${{ secrets.ADSKIPPER_KEY_PASSWORD }}
        run: |
          test -n "$ADSKIPPER_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$ADSKIPPER_KEYSTORE_BASE64" | base64 --decode > .signing/adskipper-release.jks
          cat > keystore.properties <<EOF
          storeFile=.signing/adskipper-release.jks
          storePassword=$ADSKIPPER_KEYSTORE_PASSWORD
          keyAlias=$ADSKIPPER_KEY_ALIAS
          keyPassword=$ADSKIPPER_KEY_PASSWORD
          EOF
          chmod 600 .signing/adskipper-release.jks keystore.properties

      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Prepare release assets
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/AdSkipper.apk
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          element = metadata["elements"][0]
          version_name = element["versionName"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version_name}":
              raise SystemExit(f"Tag {tag} does not match versionName v{version_name}")
          apk = Path("release/AdSkipper.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          notes = Path("RELEASE_NOTES.md").read_text(encoding="utf-8").strip()
          update = {
              "versionCode": element["versionCode"],
              "versionName": version_name,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/AdSkipper.apk",
              "sha256": digest,
              "size": apk.stat().st_size,
              "notes": notes,
          }
          Path("release/update.json").write_text(json.dumps(update, ensure_ascii=False, indent=2) + "\n")
          Path("release/checksums.txt").write_text(f"{digest}  AdSkipper.apk\n")
          Path("release/version.txt").write_text(f"{version_name}\n{element['versionCode']}\n")
          print(f"Prepared {tag}: {apk.stat().st_size} bytes, sha256={digest}")
          PY

      - name: Verify signed APK
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose release/AdSkipper.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(head -1 release/version.txt)"
          gh release create "$RELEASE_TAG" \
            release/AdSkipper.apk \
            release/update.json \
            release/checksums.txt \
            --title "AdSkipper $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
